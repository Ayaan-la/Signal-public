<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Signal Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--m:#ff2bd6;--v:#8b5cf6;--a:#39ff14;--y:#ffb800;--r:#ff2d55;--bg:#06030d;--ey:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#cdbfe8;font-family:Orbitron,'Courier New',monospace;font-size:12px;letter-spacing:1px;padding-bottom:92px;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:26px 26px}
.scan{position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,#ff2bd612,transparent);pointer-events:none;animation:sc 6s linear infinite;z-index:40}@keyframes sc{to{top:100%}}
header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#0a0618;border-bottom:2px solid var(--m);box-shadow:0 2px 18px #ff2bd655}
header .rb{width:48px}h1{margin:0;flex:1;font-size:15px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--m);letter-spacing:3px}h1 small{display:block;font-size:9px;color:var(--v);margin-top:5px;letter-spacing:2px}
#st{font-size:9px;border:1px solid var(--r);color:var(--r);padding:8px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}#st.on{border-color:var(--a);color:var(--a)}
.card{background:linear-gradient(135deg,#150b30,#0a0618);border-left:3px solid var(--m);padding:16px;margin:14px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);box-shadow:0 0 20px #8b5cf622}
.hd{color:var(--m);font-size:11px;font-weight:700;margin-bottom:8px;text-shadow:0 0 8px var(--m)}.sub{font-size:10px;color:#7d68a6;margin:12px 0 6px}
.chip{display:inline-block;padding:8px 11px;margin:4px 4px 0 0;border:1px solid #2a1458;color:#8f7ab8;font-size:10px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}.chip.on{color:#06030d;background:var(--m);border-color:var(--m);font-weight:700}
select{width:100%;background:#07030f;color:var(--y);border:1px solid #2a1458;padding:13px;font:inherit;font-size:13px;font-weight:700}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{display:flex;justify-content:space-between;align-items:center;background:#07030f;border:1px solid #2a1458;padding:14px;margin:14px 0}.pbox b{color:var(--a);font-size:19px;text-shadow:0 0 8px var(--a)}
button.b{width:100%;padding:15px;font:inherit;font-weight:700;letter-spacing:2px;margin-bottom:10px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.pri{background:linear-gradient(90deg,var(--v),var(--m));border:0;color:#fff}.sec{background:#07030f;border:1px solid var(--v);color:var(--v)}
.note{color:#6a5890;font-size:10px;line-height:1.8}.UP{color:var(--a);--ey:var(--a)}.DOWN{color:var(--r);--ey:var(--r)}.WAIT{color:var(--y);--ey:var(--y)}.ALERT{color:var(--m);--ey:var(--m)}
.rbw{text-align:center}.rbw .rb{width:130px}.rb{filter:drop-shadow(0 0 10px var(--ey))}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mth{transform-box:fill-box;transform-origin:center}.talk .mth{animation:tk .18s infinite}@keyframes tk{50%{transform:scaleY(.5)}}.ant{animation:pu 1.2s infinite}@keyframes pu{50%{opacity:.2}}
.sg{font-size:32px;font-weight:900;margin:6px 0;text-shadow:0 0 14px currentColor}.segs{display:flex;gap:4px;margin:10px 0}.segs i{flex:1;height:10px;background:#1a0f33;transform:skewX(-20deg)}.segs i.on{background:var(--ey);box-shadow:0 0 8px var(--ey)}
.it{display:flex;justify-content:space-between;background:#07030f;border-left:2px solid #2a1458;padding:9px;margin-top:5px;font-size:11px}.bu{color:var(--a)}.be{color:var(--r)}.ne{color:#74629a}
canvas{width:100%;height:220px;display:block;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a0618;border-top:2px solid var(--m);box-shadow:0 -2px 18px #ff2bd655;z-index:30}
nav div{flex:1;text-align:center;padding:10px 0;color:#6a5890;font-size:9px;cursor:pointer}nav div span{display:block;font-size:22px;margin-bottom:3px}nav .on{color:var(--m);text-shadow:0 0 8px var(--m)}
.mk{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #2a1458;cursor:pointer}sec{display:none}sec.on{display:block}
#ov{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}#ov .rb{width:170px}#bl{min-height:70px;color:var(--a);font-size:10px;line-height:2}
</style></head><body>
<div class="scan"></div>
<div id="ov"><div class="rbh rbw WAIT"></div><h1 style="flex:none;font-size:20px">CYBER SIGNAL HUB<small>REAL LIVE MARKET FEED</small></h1><div id="bl"></div><button class="b pri" id="go" style="width:80%;max-width:320px">▶ INITIALIZE SYSTEM</button></div>
<header><div class="rbh" id="hr"></div><h1>CYBER SIGNAL HUB<small>LIVE DERIV FEED · 11 INDICATORS</small></h1><div id="st">OFFLINE</div></header>

<sec id="t0" class="on">
<div class="card"><div class="hd">▌MARKET SELECTOR</div><div id="ch0"></div>
<div class="sub">ASSET</div><select id="sym"></select>
<div class="g2"><div><div class="sub">TIMEFRAME</div><select id="tf"></select></div><div><div class="sub">STRATEGY</div><select id="md"><option value="conf">Full Confluence</option><option value="trend">Trend Following</option><option value="rev">Reversal Hunter</option></select></div></div>
<div class="pbox"><span style="color:#7d68a6">LIVE PRICE</span><b id="px">...</b></div>
